# Weekly: rebuild actllminfer/data/model_prices.json from LiteLLM's price data
# and open a pull request when prices, new models or retirements changed it.
# ActRouter's own weekly sync (an hour later) reads this table from `develop`,
# so merging this PR is what lets the change reach ActRouter.
#
# Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings -> Actions -> General -> Workflow permissions).
name: Update model prices

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-model-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e '.[test]'

      - name: Rebuild the price table
        run: |
          python scripts/update_prices.py | tee report.txt
          {
            echo "Weekly rebuild of \`actllminfer/data/model_prices.json\` from LiteLLM's price data,"
            echo "read at each provider's official route. Models that disappeared upstream or passed"
            echo "their deprecation date are removed; new models are added."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "Generated by \`.github/workflows/update-prices.yml\`."
          } > pr-body.md

      - name: Test
        run: python -m pytest -q

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: develop
          branch: automation/update-model-prices
          add-paths: actllminfer/data/model_prices.json
          commit-message: Update model prices from LiteLLM
          title: Update model prices
          body-path: pr-body.md
          delete-branch: true
