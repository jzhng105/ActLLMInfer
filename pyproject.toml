[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actllminfer"
version = "0.2.0"
description = "Integrated LLM inference engine with a LangChain-Core-style interface across Kimi, GLM, MiniMax, DeepSeek, OpenAI, Anthropic, Hugging Face, and NVIDIA NIM."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Juntao Zhang" }]
keywords = ["llm", "inference", "kimi", "moonshot", "glm", "zhipuai", "minimax", "deepseek", "openai", "anthropic", "huggingface", "nvidia", "nim"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28",
    "typing-extensions>=4.5",
]

[project.optional-dependencies]
async = ["httpx>=0.25"]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "httpx>=0.25"]

[project.urls]
Homepage = "https://github.com/jzhng105/actllminfer"
Source = "https://github.com/jzhng105/actllminfer"

[tool.setuptools.packages.find]
where = ["."]
include = ["actllminfer*"]
exclude = ["tests*"]
